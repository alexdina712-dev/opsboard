services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: opsboard
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsboard -d opsboard']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      DATABASE_URL: postgresql://opsboard:local_dev_only@db:5432/opsboard
      APP_ORIGIN: http://127.0.0.1:4000
      # HTTP localhost demo: secure cookies are disabled only in this dev profile.
      NODE_ENV: development
      SERVE_WEB: 'true'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
